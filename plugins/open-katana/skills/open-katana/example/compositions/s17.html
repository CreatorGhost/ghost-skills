        <div id="s17-world" class="world">

            <div id="s17-head"><span class="mono l">▶ PLAYBACK</span><span class="mono">MAIN.MP4 · 8×</span></div>
            <div id="s17-view">
              <div id="s17-m1" class="s17-m"><div class="hero ink">HOLY</div><div class="hero lime">SH✱T</div></div>

  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      const c = K.cue("s17");
      const A = c(16, 3) - 0.1, Z = c(16, 7) + 0.3, OUT = 2.18;
      K.drift(tl, "#s17-drift", 2.4, { rotationY: -9, rotationX: 4 }, { rotationY: 8, rotationX: -3 });
      tl.fromTo("#s17-world", { scale: 0.45, opacity: 0, filter: "blur(10px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.34, ease: "expo.out" }, 0);
      // the film so far, scrubbed at speed inside its own player
      const step = (Z - A) / 7;
      for (let i = 1; i <= 7; i++) {
        const m = "#s17-m" + i, t = A + (i - 1) * step;
        tl.set(m, { opacity: 1 }, t); if (i < 7) tl.set(m, { opacity: 0 }, t + step);
        tl.fromTo(m, { scale: 1.5, x: 140 }, { scale: 1, x: 0, duration: step * 0.7, ease: "expo.out", immediateRender: false }, t);
      }
      const sec = document.getElementById("s17-sec");
      tl.fromTo("#s17-fill", { scaleX: 0 }, { scaleX: 1, duration: Z - A, ease: "none" }, A);
      K.track(tl, [[A, 0], [Z, 54]], (v) => { const s = String(Math.round(v)).padStart(2, "0"); if (sec.textContent !== s) sec.textContent = s; });
      // the player folds down to a single point: the idea it all started from
      tl.to("#s17-world", { scale: 0.03, x: -630, y: 260, opacity: 0.6, duration: 0.2, ease: "power3.in" }, OUT);
      window.__timelines["s17"] = tl;
    })();
