    (() => {

      const c = K.cue("s19");
      const ONE = c(18, 1) - 0.03, PROMPT = c(18, 2) - 0.03, AND = c(19, 1) - 0.04, IT = c(19, 3) + 0.2;
      // the film's last drift is slow and stops: the end card is still
      tl.fromTo("#s19-drift", { rotationY: -7, rotationX: 4 }, { rotationY: 0, rotationX: 0, duration: 2.6, ease: "power2.out" }, 0);
